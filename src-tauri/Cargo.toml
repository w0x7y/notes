[package]
name = "notes"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "notes"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
regex = "1"
base64 = "0.22"
tempfile = "3"
pathdiff = "0.2"
libc = "0.2"
percent-encoding = "2"
pulldown-cmark = "0.13"
trash = "5.2"
quick-xml = "0.42"

[build-dependencies]
tauri-build = { version = "2", features = [] }
