[package]
name = "notes"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "notes"
path = "src/main.rs"

[dependencies]
tauri = { version = "=2.9.5", features = [] }
tauri-plugin-dialog = { version = "=2.6.0", default-features = false, features = ["xdg-portal"] }
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-opener = "=2.5.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
regex = "1"
base64 = "0.22"
tempfile = "3"
pathdiff = "0.2"
libc = "0.2"
percent-encoding = "2"
pulldown-cmark = "0.13"
trash = "5.2"
quick-xml = "0.42"

[build-dependencies]
tauri-build = { version = "=2.5.3", features = [] }

# Isolated GTK 4 experiment, pinned upstream source archives.
[patch.crates-io]
tauri = { path = "/home/idan/.cache/notes-gtk4-experiment/upstream/tauri-402ebddca9c2891594341edc7f5967ed1f6ded54/crates/tauri" }
tauri-runtime = { path = "/home/idan/.cache/notes-gtk4-experiment/upstream/tauri-402ebddca9c2891594341edc7f5967ed1f6ded54/crates/tauri-runtime" }
tauri-runtime-wry = { path = "/home/idan/.cache/notes-gtk4-experiment/upstream/tauri-402ebddca9c2891594341edc7f5967ed1f6ded54/crates/tauri-runtime-wry" }
